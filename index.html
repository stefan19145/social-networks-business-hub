
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social-Networks | Business Hub</title>
  <style>
    :root {
      --blue: #2563eb;
      --bg: #f5f7fb;
      --text: #172033;
      --muted: #718096;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login {
      width: 100%;
      max-width: 420px;
      background: white;
      border: 1px solid #e8edf4;
      border-radius: 22px;
      padding: 38px;
      box-shadow: 0 18px 60px rgba(20,40,80,.06);
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--blue);
      color: white;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 26px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 10px;
      letter-spacing: -.7px;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #dce3ed;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #2563eb18;
    }

    button {
      width: 100%;
      padding: 15px;
      background: var(--blue);
      color: white;
      border: 0;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 18px;
    }

    button:hover { background: #1d4ed8; }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: #9aa5b5;
    }

    @media(max-width:480px) {
      .login { padding: 28px 22px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>
<body>

  <main class="page">
    <section class="login">
      <div class="logo">S</div>

      <h1>Welkom terug</h1>
      <p>
        Log in op de Social-Networks Business Hub.
        Al jouw bedrijven op één plek.
      </p>

      <form id="loginForm">
        <label for="email">E-mailadres</label>
        <input
          type="email"
          id="email"
          placeholder="naam@bedrijf.nl"
          autocomplete="email"
          required
        >

        <button type="submit">
          Verificatiecode aanvragen
        </button>
      </form>

      <div class="footer">
        Social-Networks Business Hub
        <br>
        Versie 0.1.0 · Demo
      </div>
    </section>
  </main>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        alert(
          "Dit is een demo. De beveiligde " +
          "e-mailverificatie bouwen we in de volgende stap."
        );
      });
  </script>

</body>
</html>
